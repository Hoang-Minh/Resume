<html lang="en">

    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

      name="description"
      content="Senior full stack developer in Angular and .NET. I led the replacement of Orange County's 20-year-old property tax system — 886,000 bills, $9.7 billion — and have been its sole developer since launch."

      id="theme-color-light"

    <meta property="og:type" content="website" />

    <link rel="canonical" href="https://minhnguyendev.com/" />
