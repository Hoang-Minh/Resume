<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Not found — Minh Nguyen</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <style>
      :root {
        --paper: #f4f5f3;
        --ink: #14181b;
        --ink-muted: #55605c;
        --rule: #d3d8d3;
        --accent: #1b5e4b;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --paper: #0f1315;
          --ink: #e7eae6;
          --ink-muted: #98a29e;
          --rule: #2a3134;
          --accent: #5fb795;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-content: center;
        gap: 1rem;
        padding: 2rem;
        background: var(--paper);
        color: var(--ink);
        font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
        line-height: 1.6;
      }
      p.eyebrow {
        margin: 0;
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.11em;
        text-transform: uppercase;
        color: var(--ink-muted);
      }
      h1 {
        margin: 0;
        font-size: clamp(1.7rem, 4vw, 2.25rem);
        letter-spacing: -0.02em;
      }
      p.detail {
        margin: 0;
        max-width: 42ch;
        color: var(--ink-muted);
      }
      a {
        color: var(--accent);
        text-underline-offset: 0.22em;
      }
      hr {
        border: 0;
        border-top: 1px solid var(--rule);
        margin: 0.5rem 0;
      }
    </style>
  </head>
  <body>
    <p class="eyebrow">404</p>
    <h1>That page isn't here.</h1>
    <hr />
    <p class="detail">
      The link may be out of date. Everything on this site is reachable from the
      <a href="/">home page</a>.
    </p>
  </body>
</html>
